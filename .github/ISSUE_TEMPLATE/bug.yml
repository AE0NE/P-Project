name: 오류 보고
description: 재현 가능한 오류와 기대 동작을 기록합니다.
title: "[버그] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 환경, 실행 명령, 재현용 합성 입력을 적어 주세요. 개인정보나 원본 금융 문서는 붙여넣지 마세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 확인 자료
      description: 민감한 내용을 제거한 오류 메시지·화면·실험 ID를 적어 주세요.
